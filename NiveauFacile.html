<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mölkky – Niveau Facile</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd0f0; font-family: system-ui, sans-serif; }
        #info { position: fixed; left: 12px; top: 10px; padding: 8px 12px; border-radius: 8px;
                background: rgba(251, 248, 239, 0.92); color: #13241c; font-size: 16px; }
        #boutons { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 8px; z-index: 5; }
        #boutons button { padding: 8px 14px; border: 0; border-radius: 8px; background: #f2b63d;
                          font-size: 16px; cursor: pointer; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>
    <div id="info">Niveau facile</div>
    <div id="boutons">
        <button id="btnRecommencer">Recommencer</button>
        <button id="btnMenu">Menu principal</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        // =====================================================
        // 1. CONSTANTES
        // =====================================================
        const QUILLE = { rayon: 0.067, hauteur: 0.4, masse: 0.8 };
        const BATON = { rayon: 0.03, hauteur: 0.25, masse: 1 };
        const DISTANCE_LANCER = 2.5;          // niveau facile : distance réduite (3-4 m en normal)
        const OBJECTIF = 50;
        const SCORE_DEPASSEMENT = 25;
        const ECHECS_MAX = 3;
        const DELAI_REMISE = 1;               // secondes d'attente (tout immobile) avant de compter et de relever les quilles
        const CLE_RECORD = "molkky_record_facile";
        const TABLE = { x: 0.5, hauteur: 0.9, z: -0.4 };
        const ZONE = { xMin: -0.7, xMax: 1.1, zMin: -0.4, zMax: 0.6 };   // zone de lancer : le joueur ne peut pas en sortir
        const REPETITION_HERBE = 15;                                      // nombre de fois que la texture d'herbe se répète sur le sol
        const POS_BATON = new THREE.Vector3(TABLE.x, TABLE.hauteur + BATON.rayon + 0.01, TABLE.z);
        const ROT_BATON = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI / 2, 0, 0));
        // Disposition classique du Mölkky (du plus proche au plus lointain)
        const LIGNES = [[1, 2], [3, 10, 4], [5, 11, 12, 6], [7, 9, 8]];

        const info = document.getElementById('info');

        // =====================================================
        // 2. SCÈNE, CAMÉRA, RENDU (avec WebXR)
        // =====================================================
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);   // couleur de secours le temps que l'image charge

        const chargeur = new THREE.TextureLoader();
        chargeur.load("image/sky.jpg", (tex) => {
            tex.mapping = THREE.EquirectangularReflectionMapping;
            tex.colorSpace = THREE.SRGBColorSpace;
            scene.background = tex;
        }, undefined, () => console.warn("sky.jpg non chargée : lance la page avec un serveur local (Live Server)."));

        const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 1000);
        camera.position.set(0, 1.6, 0.6);
        camera.lookAt(0, 0.5, -2.5);

        // "Chariot" du joueur : on déplace ce groupe avec le joystick (caméra + manettes dedans)
        const rig = new THREE.Group();
        scene.add(rig);
        rig.add(camera);

        scene.add(new THREE.HemisphereLight("#dfffff", "#4a6633", 1.2));
        const soleil = new THREE.DirectionalLight("#ffffff", 1.5);
        soleil.position.set(2, 4, 0);
        soleil.target.position.set(0, 0, -2);
        soleil.castShadow = true;
        Object.assign(soleil.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 });
        scene.add(soleil, soleil.target);

        const texHerbe = chargeur.load("image/herbe_sol.png", undefined, undefined, () => {
            // image introuvable ou bloquée (page ouverte en file://) : on revient au vert uni
            herbe.material.map = null;
            herbe.material.color.set("#5e9c4a");
            herbe.material.needsUpdate = true;
            console.warn("herbe_sol.png non chargée : lance la page avec un serveur local (Live Server).");
        });
        texHerbe.colorSpace = THREE.SRGBColorSpace;
        texHerbe.wrapS = texHerbe.wrapT = THREE.RepeatWrapping;
        texHerbe.repeat.set(REPETITION_HERBE, REPETITION_HERBE);
        texHerbe.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const herbe = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 30),
            new THREE.MeshStandardMaterial({ map: texHerbe })
        );
        herbe.rotation.x = -Math.PI / 2;
        herbe.receiveShadow = true;
        scene.add(herbe);

        addEventListener("resize", () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        // Zone de lancer (là où se tient le joueur)
        const zone = new THREE.Mesh(
            new THREE.PlaneGeometry(ZONE.xMax - ZONE.xMin, ZONE.zMax - ZONE.zMin),
            new THREE.MeshStandardMaterial({ color: "#f4e6c8" })
        );
        zone.rotation.x = -Math.PI / 2;
        zone.position.set((ZONE.xMin + ZONE.xMax) / 2, 0.004, (ZONE.zMin + ZONE.zMax) / 2);
        zone.receiveShadow = true;
        scene.add(zone);

        // Table
        const boisTable = new THREE.MeshStandardMaterial({ color: "#8a5a35", roughness: 0.8 });
        const plateau = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 0.6), boisTable);
        plateau.position.set(TABLE.x, TABLE.hauteur - 0.025, TABLE.z);
        plateau.castShadow = plateau.receiveShadow = true;
        scene.add(plateau);
        for (const dx of [-0.25, 0.25]) for (const dz of [-0.25, 0.25]) {
            const pied = new THREE.Mesh(new THREE.BoxGeometry(0.05, TABLE.hauteur - 0.05, 0.05), boisTable);
            pied.position.set(TABLE.x + dx, (TABLE.hauteur - 0.05) / 2, TABLE.z + dz);
            pied.castShadow = true;
            scene.add(pied);
        }

        // =====================================================
        // 3. PHYSIQUE
        // =====================================================
        const monde = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.81, 0), allowSleep: true });
        monde.solver.iterations = 20;
        const boisPhys = new CANNON.Material("bois");
        const herbePhys = new CANNON.Material("herbe");
        monde.addContactMaterial(new CANNON.ContactMaterial(boisPhys, herbePhys,
            { friction: 0.6, restitution: 0.12, contactEquationStiffness: 5e6, contactEquationRelaxation: 3 }));
        monde.addContactMaterial(new CANNON.ContactMaterial(boisPhys, boisPhys,
            { friction: 0.4, restitution: 0.25, contactEquationStiffness: 5e6, contactEquationRelaxation: 3 }));

        const solPhys = new CANNON.Body({ type: CANNON.Body.STATIC, material: herbePhys });
        solPhys.addShape(new CANNON.Plane());
        solPhys.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        monde.addBody(solPhys);

        // Table physique (pour que le bâton lâché ne passe pas à travers)
        const tablePhys = new CANNON.Body({ type: CANNON.Body.STATIC, material: boisPhys });
        tablePhys.addShape(new CANNON.Box(new CANNON.Vec3(0.3, 0.025, 0.3)));
        tablePhys.position.set(TABLE.x, TABLE.hauteur - 0.025, TABLE.z);
        monde.addBody(tablePhys);

        // =====================================================
        // 4. QUILLES NUMÉROTÉES (12) EN DISPOSITION MÖLKKY
        // =====================================================
        const boisClair = () => new THREE.MeshStandardMaterial({ color: "#e8cf9f", roughness: 0.7 });

        function creerTextureNumero(numero) {
            const c = document.createElement("canvas");
            c.width = c.height = 128;
            const g = c.getContext("2d");
            g.fillStyle = "#f4e6c8";
            g.fillRect(0, 0, 128, 128);
            g.fillStyle = "#13241c";
            g.font = "bold 80px system-ui, sans-serif";
            g.textAlign = "center";
            g.textBaseline = "middle";
            g.fillText(numero, 64, 68);
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function placerQuille(q, x, z) {
            q.corps.position.set(x, QUILLE.hauteur / 2 + 0.001, z);
            q.corps.quaternion.set(0, 0, 0, 1);
            q.corps.velocity.set(0, 0, 0);
            q.corps.angularVelocity.set(0, 0, 0);
            q.corps.wakeUp();
        }

        const quilles = [];
        LIGNES.forEach((ligne, r) => ligne.forEach((numero, i) => {
            const x = (i - (ligne.length - 1) / 2) * 0.16;
            const z = -DISTANCE_LANCER - r * 0.15;
            const materiaux = [
                boisClair(),
                new THREE.MeshStandardMaterial({ map: creerTextureNumero(numero) }),
                boisClair()
            ];
            const mesh = new THREE.Mesh(
                new THREE.CylinderGeometry(QUILLE.rayon, QUILLE.rayon, QUILLE.hauteur, 24), materiaux);
            mesh.castShadow = true;
            scene.add(mesh);
            const corps = new CANNON.Body({ mass: QUILLE.masse, material: boisPhys });
            corps.addShape(new CANNON.Cylinder(QUILLE.rayon, QUILLE.rayon, QUILLE.hauteur, 12));
            monde.addBody(corps);
            const q = { numero, x0: x, z0: z, mesh, corps };
            placerQuille(q, x, z);
            quilles.push(q);
        }));

        // =====================================================
        // 5. LE BÂTON (le "Mölkky" que l'on lance)
        // =====================================================
        const baton = new THREE.Mesh(
            new THREE.CylinderGeometry(BATON.rayon, BATON.rayon, BATON.hauteur, 24), boisClair());
        baton.castShadow = true;
        scene.add(baton);
        const batonCorps = new CANNON.Body({ mass: BATON.masse, material: boisPhys });
        batonCorps.addShape(new CANNON.Cylinder(BATON.rayon, BATON.rayon, BATON.hauteur, 12));

        function remettreBatonSurTable() {
            baton.position.copy(POS_BATON);
            baton.rotation.set(Math.PI / 2, 0, 0);
        }

        // =====================================================
        // 6. ÉTAT DE LA PARTIE
        // =====================================================
        const partie = {
            etat: "pret",        // "pret" | "saisi" | "vol" | "fini"
            score: 0, lancer: 1, dernierPoints: 0, echecs: 0,
            temps: 0, chrono: false,
            message: "", couleur: "#13241c",
            historique: []       // un objet par lancer : quilles tombées, points, score total, n° du lancer
        };
        let tempsLancer = 0;
        let attenteFin = 0;

        function formaterTemps(s) {
            const m = Math.floor(s / 60), sec = Math.floor(s % 60);
            return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
        }

        // ---- Sauvegarde locale du meilleur résultat ----
        function chargerRecord() {
            try { return JSON.parse(localStorage.getItem(CLE_RECORD)); } catch { return null; }
        }
        function sauvegarderRecord(lancers, temps) {
            const ancien = chargerRecord();
            const meilleur = !ancien || lancers < ancien.lancers || (lancers === ancien.lancers && temps < ancien.temps);
            if (meilleur) {
                try { localStorage.setItem(CLE_RECORD, JSON.stringify({ lancers, temps })); } catch {}
            }
        }

        function nouvellePartie() {
            if (monde.bodies.includes(batonCorps)) monde.removeBody(batonCorps);
            quilles.forEach((q) => placerQuille(q, q.x0, q.z0));
            remettreBatonSurTable();
            Object.assign(partie, {
                etat: "pret", score: 0, lancer: 1, dernierPoints: 0, echecs: 0,
                temps: 0, chrono: false, historique: [],
                message: "Saisis le bâton avec le grip, lance en le relâchant !", couleur: "#13241c"
            });
            tempsLancer = 0;
            dessinerTableau();
        }

        // =====================================================
        // 7. TABLEAU D'AFFICHAGE 3D (score, lancer, échecs, temps...)
        // =====================================================
        const cvsHUD = document.createElement("canvas");
        cvsHUD.width = 640; cvsHUD.height = 480;
        const gHUD = cvsHUD.getContext("2d");
        const texHUD = new THREE.CanvasTexture(cvsHUD);
        texHUD.colorSpace = THREE.SRGBColorSpace;
        const panneau = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.9), new THREE.MeshBasicMaterial({ map: texHUD }));
        panneau.position.set(-1.3, 1.6, -1.8);
        panneau.lookAt(0, 1.6, 0);
        scene.add(panneau);

        function dessinerTableau() {
            const g = gHUD;
            g.fillStyle = "#f4e6c8"; g.fillRect(0, 0, 640, 480);
            g.fillStyle = "#4f9d63"; g.fillRect(0, 0, 640, 70);
            g.fillStyle = "#ffffff"; g.font = "bold 40px system-ui, sans-serif";
            g.textAlign = "center"; g.fillText("MÖLKKY – Facile", 320, 50);

            const record = chargerRecord();
            const lignes = [
                `Score : ${partie.score} / ${OBJECTIF}`,
                `Lancer n° ${partie.lancer}`,
                `Dernier lancer : +${partie.dernierPoints}`,
                `Échecs consécutifs : ${partie.echecs} / ${ECHECS_MAX}`,
                `Temps : ${formaterTemps(partie.temps)}`,
                `Record : ${record ? record.lancers + " lancers, " + formaterTemps(record.temps) : "—"}`
            ];
            g.textAlign = "left"; g.fillStyle = "#13241c"; g.font = "34px system-ui, sans-serif";
            lignes.forEach((l, i) => g.fillText(l, 30, 125 + i * 50));

            g.fillStyle = partie.couleur; g.font = "bold 30px system-ui, sans-serif";
            g.fillText(partie.message, 30, 440, 580);
            texHUD.needsUpdate = true;

            info.textContent = `Score ${partie.score}/${OBJECTIF} | Lancer ${partie.lancer} | ` +
                `Dernier +${partie.dernierPoints} | Échecs ${partie.echecs}/${ECHECS_MAX} | ${formaterTemps(partie.temps)} — ${partie.message}`;
        }

        // =====================================================
        // 8. MANETTES VR : déplacement (joystick), saisie (grip), lancer
        // =====================================================
        const DISTANCE_SAISIE = 0.3;        // distance max main -> bâton pour le saisir
        const VITESSE_DEPLACEMENT = 2;      // m/s
        const VITESSE_ROTATION = 1.5;       // rad/s
        let manetteActive = null;
        let trace = [];                     // dernières positions (monde) de la manette, pour la vitesse du lancer
        const posTmp = new THREE.Vector3();
        const quatTmp = new THREE.Quaternion();

        const manettes = [0, 1].map((i) => {
            const m = renderer.xr.getController(i);
            m.add(new THREE.Mesh(
                new THREE.ConeGeometry(0.02, 0.08, 12).rotateX(-Math.PI / 2),
                new THREE.MeshStandardMaterial({ color: "#333333" })));
            m.addEventListener("squeezestart", () => saisirBaton(m));                          // grip appuyé : on saisit
            m.addEventListener("squeezeend", () => { if (manetteActive === m) lacherBaton(); }); // grip relâché : on lance
            m.addEventListener("selectstart", () => { if (partie.etat === "fini") nouvellePartie(); }); // gâchette en fin de partie
            rig.add(m);   // les manettes suivent le chariot du joueur
            return m;
        });

        function saisirBaton(m) {
            if (partie.etat !== "pret") return;
            m.getWorldPosition(posTmp);
            if (posTmp.distanceTo(baton.position) > DISTANCE_SAISIE) return;   // trop loin du bâton
            manetteActive = m;
            trace = [];
            partie.etat = "saisi";
        }

        function suivreManette(maintenant) {
            manetteActive.getWorldPosition(posTmp);
            manetteActive.getWorldQuaternion(quatTmp);
            baton.position.copy(posTmp);
            baton.quaternion.copy(quatTmp).multiply(ROT_BATON);
            trace.push({ p: posTmp.clone(), t: maintenant });
            while (trace.length && maintenant - trace[0].t > 120) trace.shift();
        }

        // Vitesse de la manette (m/s) calculée sur les ~120 dernières ms
        function vitesseManette() {
            if (trace.length < 2) return new THREE.Vector3();
            const a = trace[0], b = trace[trace.length - 1];
            const d = (b.t - a.t) / 1000;
            if (d < 0.02) return new THREE.Vector3();
            return b.p.clone().sub(a.p).divideScalar(d);
        }

        // Joystick gauche : se déplacer dans la zone de lancer. Joystick droit : tourner. Bouton A / X : recommencer.
        const boutonAvant = {};
        const zoneMorte = (v) => (Math.abs(v) < 0.15 ? 0 : v);
        const dirTete = new THREE.Vector3();
        const droiteTete = new THREE.Vector3();
        const HAUT = new THREE.Vector3(0, 1, 0);

        function lireJoysticks(dt) {
            const session = renderer.xr.getSession();
            if (!session) return;
            let avance = 0, lateral = 0, rotation = 0;
            for (const source of session.inputSources) {
                const pad = source.gamepad;
                if (!pad) continue;
                const x = zoneMorte(pad.axes[2] ?? pad.axes[0] ?? 0);
                const y = zoneMorte(pad.axes[3] ?? pad.axes[1] ?? 0);
                if (source.handedness === "left") { lateral = x; avance = -y; }
                if (source.handedness === "right") rotation = x;
                const appuye = !!pad.buttons[4]?.pressed;
                if (appuye && !boutonAvant[source.handedness]) nouvellePartie();
                boutonAvant[source.handedness] = appuye;
            }
            renderer.xr.getCamera().getWorldDirection(dirTete);
            dirTete.y = 0;
            if (dirTete.lengthSq() > 1e-4) {
                dirTete.normalize();
                droiteTete.crossVectors(dirTete, HAUT);
                rig.position.addScaledVector(dirTete, avance * VITESSE_DEPLACEMENT * dt);
                rig.position.addScaledVector(droiteTete, lateral * VITESSE_DEPLACEMENT * dt);
                rig.position.x = Math.min(ZONE.xMax, Math.max(ZONE.xMin, rig.position.x));
                rig.position.z = Math.min(ZONE.zMax, Math.max(ZONE.zMin, rig.position.z));
            }
            rig.rotation.y -= rotation * VITESSE_ROTATION * dt;
        }

        function lacherBaton() {
            const v = vitesseManette();
            manetteActive = null;
            ligneAide.visible = false;
            cible.visible = false;
            if (v.length() < 1) {            // simple dépôt : on le remet sur la table, pas de lancer
                partie.etat = "pret";
                remettreBatonSurTable();
                return;
            }
            envoyerBaton(v);
        }

        function envoyerBaton(v) {
            batonCorps.position.copy(baton.position);
            batonCorps.quaternion.copy(baton.quaternion);
            batonCorps.velocity.set(v.x, v.y, v.z);
            // rotation du bâton en vol, autour de l'axe perpendiculaire à la direction du lancer
            const dir = new THREE.Vector3(v.x, 0, v.z).normalize();
            const rot = new THREE.Vector3(0, 1, 0).cross(dir).multiplyScalar(6);
            batonCorps.angularVelocity.set(rot.x, rot.y, rot.z);
            batonCorps.wakeUp();
            monde.addBody(batonCorps);
            partie.etat = "vol";
            partie.chrono = true;
            tempsLancer = 0;
            attenteFin = 0;
        }

        // =====================================================
        // 9. ASSISTANCE VISUELLE (niveau facile) : trajectoire prévue
        // =====================================================
        const NB_POINTS = 40;
        const ligneAide = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(Array.from({ length: NB_POINTS }, () => new THREE.Vector3())),
            new THREE.LineBasicMaterial({ color: "#f2b63d" }));
        ligneAide.frustumCulled = false;
        ligneAide.visible = false;
        scene.add(ligneAide);

        const cible = new THREE.Mesh(
            new THREE.RingGeometry(0.1, 0.14, 32).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial({ color: "#f2b63d" }));
        cible.visible = false;
        scene.add(cible);

        function mettreAJourAssistance() {
            const v = vitesseManette();
            if (v.length() < 1) { ligneAide.visible = false; cible.visible = false; return; }
            const p0 = baton.position;
            const pos = ligneAide.geometry.attributes.position;
            let atterri = false, fx = 0, fz = 0;
            for (let i = 0; i < NB_POINTS; i++) {
                const t = i * 0.05;
                let x = p0.x + v.x * t, y = p0.y + v.y * t - 0.5 * 9.81 * t * t, z = p0.z + v.z * t;
                if (atterri) { x = fx; z = fz; y = 0.01; }
                else if (y < 0.01) { atterri = true; y = 0.01; fx = x; fz = z; cible.position.set(x, 0.015, z); }
                pos.setXYZ(i, x, y, z);
            }
            pos.needsUpdate = true;
            ligneAide.visible = true;
            cible.visible = atterri;
        }

        // =====================================================
        // 10. DÉTECTION DES QUILLES TOMBÉES + SCORE
        // =====================================================
        function inclinaisonDeg(q) {
            const haut = 1 - 2 * (q.x * q.x + q.z * q.z);
            return (Math.acos(Math.min(1, Math.max(-1, haut))) * 180) / Math.PI;
        }

        function calculerPoints(tombees) {
            if (tombees.length === 0) return 0;
            if (tombees.length === 1) return tombees[0].numero;   // 1 quille : son numéro
            return tombees.length;                                // plusieurs : leur nombre
        }

        function surveillerLancer(dt) {
            tempsLancer += dt;
            const batonImmobile = batonCorps.velocity.length() < 0.15;
            const quillesImmobiles = quilles.every((q) =>
                q.corps.velocity.length() < 0.1 && q.corps.angularVelocity.length() < 0.3);
            // on attend que tout soit immobile pendant DELAI_REMISE secondes (les quilles ont le temps de finir de tomber)
            if (tempsLancer > 1.5 && batonImmobile && quillesImmobiles) attenteFin += dt;
            else attenteFin = 0;
            if (attenteFin >= DELAI_REMISE || tempsLancer > 12) terminerLancer();
        }

        function terminerLancer() {
            const tombees = quilles.filter((q) => inclinaisonDeg(q.corps.quaternion) >= 60);
            const points = calculerPoints(tombees);
            let total = partie.score + points;
            let message, couleur;

            if (points === 0) {
                partie.echecs++;
                message = `Raté ! Aucun point (échec ${partie.echecs}/${ECHECS_MAX})`;
                couleur = "#c8553d";
            } else {
                partie.echecs = 0;
                message = `+${points} point${points > 1 ? "s" : ""} !`;
                couleur = "#2f7d46";
            }
            if (total > OBJECTIF) {
                total = SCORE_DEPASSEMENT;
                message = `Dépassement de ${OBJECTIF} ! Retour à ${SCORE_DEPASSEMENT} points`;
                couleur = "#d98a00";
            }

            partie.dernierPoints = points;
            partie.score = total;
            partie.message = message;
            partie.couleur = couleur;
            partie.historique.push({
                lancer: partie.lancer,
                quillesTombees: tombees.map((q) => q.numero),
                points,
                scoreTotal: total
            });

            // Chaque quille tombée est remise debout là où elle est tombée
            tombees.forEach((q) => placerQuille(q, q.corps.position.x, q.corps.position.z));
            monde.removeBody(batonCorps);
            remettreBatonSurTable();

            if (total === OBJECTIF) finDePartie(true);
            else if (partie.echecs >= ECHECS_MAX) finDePartie(false);
            else { partie.lancer++; partie.etat = "pret"; }
            dessinerTableau();
        }

        function finDePartie(victoire) {
            partie.etat = "fini";
            partie.chrono = false;
            const lancers = partie.historique.length;
            const bilan = `Score ${partie.score} – ${lancers} lancers – ${formaterTemps(partie.temps)}`;
            if (victoire) {
                partie.message = `VICTOIRE ! ${bilan}`;
                partie.couleur = "#2f7d46";
                sauvegarderRecord(lancers, partie.temps);
            } else {
                partie.message = `DÉFAITE (3 échecs). ${bilan}`;
                partie.couleur = "#c8553d";
            }
            console.table(partie.historique);
        }

        // =====================================================
        // 11. LANCER À LA SOURIS (test sur ordinateur, sans casque)
        // =====================================================
        function vitesseScriptee(depart, arrivee, angleDeg, g = 9.81) {
            const dx = arrivee.x - depart.x, dz = arrivee.z - depart.z;
            const d = Math.hypot(dx, dz), dy = arrivee.y - depart.y;
            const th = (angleDeg * Math.PI) / 180;
            const denom = 2 * Math.cos(th) ** 2 * (d * Math.tan(th) - dy);
            if (denom <= 0) return null;
            const v = Math.sqrt((g * d * d) / denom);
            const h = v * Math.cos(th);
            return new THREE.Vector3((h * dx) / d, v * Math.sin(th), (h * dz) / d);
        }

        renderer.domElement.addEventListener("click", () => {
            if (renderer.xr.isPresenting || partie.etat !== "pret") return;
            const cibleLancer = { x: (Math.random() - 0.5) * 0.6, y: 0.25, z: -DISTANCE_LANCER - 0.2 };
            const v = vitesseScriptee(baton.position, cibleLancer, 22);
            if (v) envoyerBaton(v);
        });

        // =====================================================
        // 12. BOUTONS + BOUCLE PRINCIPALE
        // =====================================================
        document.getElementById("btnRecommencer").onclick = nouvellePartie;
        document.getElementById("btnMenu").onclick = () => { location.href = "M%C3%B6lkky.html"; };

        let dernier = performance.now();
        let compteurHUD = 0;

        function boucle(maintenant) {
            const dt = Math.min((maintenant - dernier) / 1000, 0.1);
            dernier = maintenant;

            monde.step(1 / 120, dt, 8);

            for (const q of quilles) {
                q.mesh.position.copy(q.corps.position);
                q.mesh.quaternion.copy(q.corps.quaternion);
            }

            if (renderer.xr.isPresenting) lireJoysticks(dt);
            if (partie.etat === "saisi") { suivreManette(maintenant); mettreAJourAssistance(); }
            if (partie.etat === "vol") {
                baton.position.copy(batonCorps.position);
                baton.quaternion.copy(batonCorps.quaternion);
                surveillerLancer(dt);
            }

            if (partie.chrono) partie.temps += dt;
            compteurHUD += dt;
            if (compteurHUD > 0.25) { compteurHUD = 0; dessinerTableau(); }

            renderer.render(scene, camera);
        }

        nouvellePartie();
        renderer.setAnimationLoop(boucle);
    </script>
</body>
